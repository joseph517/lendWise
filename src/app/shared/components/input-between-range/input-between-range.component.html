<mat-form-field class="loan-amount" appearance="fill">
  <mat-label>Monto a solicitar</mat-label>
  <input
    matInput
    type="number"
    [(ngModel)]="loanAmount"
    [min]="10000"
    [max]="100000"
    [step]="1000"
    name="amount"
    (ngModelChange)="onLoanAmountChange($event)" />
</mat-form-field>
