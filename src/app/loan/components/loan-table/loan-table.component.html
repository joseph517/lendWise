<mat-card class="loan-table-card">
    <img src="../../../../assets/images/bank.png" class="bank-image" alt="bank">
    <mat-card-title class="text-center m-3" *ngIf="dataSource.length > 0; else noLoans">Préstamos Pendientes</mat-card-title>
    <ng-container *ngIf="dataSource.length > 0">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 loan-table">
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Nombre</th>
                <td mat-cell *matCellDef="let element">{{ element.user.name }}</td>
            </ng-container>

            <ng-container matColumnDef="amount">
                <th mat-header-cell *matHeaderCellDef>Monto</th>
                <td mat-cell *matCellDef="let element">${{ element.loan.amount }}</td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Acción</th>
                <td mat-cell *matCellDef="let element">
                    <button mat-raised-button color="primary" (click)="onPayLoan(element.loan.id!)">
                        Pagar
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    </ng-container>

    <ng-template #noLoans>
        <mat-card-title class="text-center m-3">No hay préstamos pendientes</mat-card-title>
    </ng-template>
</mat-card>
